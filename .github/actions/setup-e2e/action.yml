name: Set up e2e
description: pnpm, Node, dependencies, and a version-keyed cache of Playwright's Chromium (shared by ci.yml and e2e-real-world.yml)

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.3.4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - id: playwright
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: browser-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    # A cache hit restores the browser binary but not the OS packages it needs.
    - if: steps.browser-cache.outputs.cache-hit != 'true'
      run: pnpm exec playwright install --with-deps chromium
      shell: bash
    - if: steps.browser-cache.outputs.cache-hit == 'true'
      run: pnpm exec playwright install-deps chromium
      shell: bash
