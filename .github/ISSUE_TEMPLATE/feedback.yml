name: Feedback
description: Report a bug or share feedback about EstiMate
title: '[Feedback]: '
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: >-
        **Something went wrong in a live session?** In the EstiMate tab, add
        `/diagnosis` to the end of the address in your browser's address bar,
        download the report there and send the file to the organiser directly.
        Don't attach it here: this form is public.
  - type: textarea
    id: feedback
    attributes:
      label: What happened, or what would you like to see?
      description: >-
        Describe the bug or your suggestion. Include what you expected to
        happen and what happened instead, if applicable.
      placeholder: Type your feedback here...
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: >-
        If it helps, drag and drop a screenshot or screen recording here.
    validations:
      required: false
