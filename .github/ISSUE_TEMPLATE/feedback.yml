name: Feedback
description: Report a bug or share feedback about EstiMate
title: '[Feedback]: '
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: >-
        **Something went wrong in a live session?** Open a new browser tab with
        EstiMate's address, but replace everything after the site name with
        `/diagnosis` (for example, `…/estimate` becomes `…/diagnosis`). Keep the
        EstiMate tab open, so a running session goes on. Download the report
        there and send the file to the organiser directly. Don't attach it here:
        this form is public.
  - type: textarea
    id: feedback
    attributes:
      label: What happened, or what would you like to see?
      description: >-
        Describe the bug or your suggestion. Include what you expected to
        happen and what happened instead, if applicable.
      placeholder: Type your feedback here...
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: >-
        If it helps, drag and drop a screenshot or screen recording here.
    validations:
      required: false
