name: Docs site

# Builds the docs site (site/) from docs/ and specs/ and publishes it with
# GitHub Pages. CI's docs-site job runs the same build on every pull request.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'specs/**'
      - 'site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a queued one, never a running one.
concurrency:
  group: docs-site
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
