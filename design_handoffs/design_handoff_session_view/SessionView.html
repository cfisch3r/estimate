<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="reference/nocturne-styles.css">
<title>Session View — reference</title>
</head>
<body>
<div style="min-height:100vh;background:var(--color-bg);font-family:var(--font-body);">
  <nav class="nav" style="position:relative;">
    <span class="nav-brand" style="display:flex;align-items:center;gap:var(--space-2);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.4"><path d="M4 3v18M20 3v18M4 12h16"/></svg>
      EstiMate
    </span>
    <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-neutral-400);">Session</div>
      <div style="font-size:20px;font-weight:500;color:var(--color-text);">adccsdf</div>
    </div>
  </nav>

  <div style="display:grid;grid-template-columns:260px 1fr;gap:var(--space-6);max-width:1280px;margin:0 auto;padding:var(--space-6) var(--space-4);min-height:calc(100vh - 64px);">
    <aside style="display:flex;flex-direction:column;gap:var(--space-4);">
      <div style="display:flex;align-items:baseline;gap:var(--space-2);">
        <span style="font-size:15px;font-weight:500;color:var(--color-text);">Items</span>
        <span style="font-size:13px;color:var(--color-neutral-400);">2/3 finalized</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:var(--space-2);">
        <div style="display:flex;align-items:center;gap:var(--space-2);border-radius:var(--radius-md);padding:var(--space-3);color:var(--color-text);font-size:15px;border:1px solid var(--color-accent);"><svg style="color:var(--color-neutral-500);flex-shrink:0;" width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><circle cx="92" cy="60" r="12"></circle><circle cx="164" cy="60" r="12"></circle><circle cx="92" cy="128" r="12"></circle><circle cx="164" cy="128" r="12"></circle><circle cx="92" cy="196" r="12"></circle><circle cx="164" cy="196" r="12"></circle></svg><span style="color:var(--color-accent-300);">▷</span>dsdfsdf</div>
        <div style="display:flex;align-items:center;gap:var(--space-2);border-radius:var(--radius-md);padding:var(--space-3);color:var(--color-neutral-300);font-size:15px;border:1px solid var(--color-neutral-800);"><svg style="color:var(--color-neutral-500);flex-shrink:0;" width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><circle cx="92" cy="60" r="12"></circle><circle cx="164" cy="60" r="12"></circle><circle cx="92" cy="128" r="12"></circle><circle cx="164" cy="128" r="12"></circle><circle cx="92" cy="196" r="12"></circle><circle cx="164" cy="196" r="12"></circle></svg>Login flow</div>
        <div style="display:flex;align-items:center;gap:var(--space-2);border-radius:var(--radius-md);padding:var(--space-3);color:var(--color-neutral-300);font-size:15px;border:1px solid var(--color-neutral-800);"><svg style="color:var(--color-neutral-500);flex-shrink:0;" width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><circle cx="92" cy="60" r="12"></circle><circle cx="164" cy="60" r="12"></circle><circle cx="92" cy="128" r="12"></circle><circle cx="164" cy="128" r="12"></circle><circle cx="92" cy="196" r="12"></circle><circle cx="164" cy="196" r="12"></circle></svg>Billing export</div>
      </div>
      <a href="#" style="margin-top:auto;padding-top:var(--space-4);border-top:1px solid var(--color-neutral-800);display:flex;align-items:center;gap:var(--space-2);color:var(--color-accent-300);font-size:14px;text-decoration:none;">
        <svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M228,40H160a36,36,0,0,0-32,19.6A36,36,0,0,0,96,40H28A20,20,0,0,0,8,60V180a20,20,0,0,0,20,20H96a20,20,0,0,1,20,20,8,8,0,0,0,16,0,20,20,0,0,1,20-20h68a20,20,0,0,0,20-20V60A20,20,0,0,0,228,40Z"/></svg>
        Summary
      </a>
    </aside>

    
    <main class="card" style="padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5);">
      <h1 style="margin:0;font-weight:500;font-size:22px;text-align:center;">dsdfsdf</h1>

      <div class="field">
        <label>Description (Markdown supported)</label>
        <textarea class="input" rows="3" style="font-style:italic;">dsfsdfsdf</textarea>
      </div>

      <div style="font-style:italic;color:var(--color-neutral-200);font-size:15px;">Would you stake your job this won't be exceeded?</div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4);">
        <div class="field">
          <label>Best case (weeks)</label>
          <div style="border:1px solid var(--color-neutral-700);border-radius:var(--radius-md);padding:var(--space-4);text-align:center;font-size:20px;color:var(--color-text);">2</div>
        </div>
        <div class="field">
          <label>Most likely (weeks)</label>
          <div style="border:1px solid var(--color-neutral-700);border-radius:var(--radius-md);padding:var(--space-4);text-align:center;font-size:20px;color:var(--color-text);">4</div>
        </div>
        <div class="field">
          <label>Worst case (weeks)</label>
          <div style="border:1px solid var(--color-neutral-700);border-radius:var(--radius-md);padding:var(--space-4);text-align:center;font-size:20px;color:var(--color-text);">9</div>
        </div>
      </div>

      <div style="position:relative;padding-top:20px;">
        <div style="position:absolute;top:0;left:71.4%;transform:translateX(-50%);font-size:12px;color:var(--color-neutral-400);">7.0w</div>
        <div style="height:6px;border-radius:999px;background:var(--color-neutral-800);position:relative;overflow:visible;">
          <div style="position:absolute;left:0;top:0;bottom:0;width:28.6%;background:var(--color-accent);border-radius:999px;"></div>
          <div style="position:absolute;left:28.6%;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,var(--color-accent-700) 0 4px,transparent 4px 8px);border-radius:0 999px 999px 0;"></div>
          <div style="position:absolute;left:28.6%;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:999px;background:var(--color-accent);box-shadow:var(--shadow-sm);"></div>
          <div style="position:absolute;left:71.4%;top:-6px;bottom:-6px;width:2px;background:var(--color-neutral-300);"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:var(--space-2);font-size:12px;color:var(--color-neutral-400);">
          <span>2w best</span>
          <span style="position:absolute;left:28.6%;transform:translateX(-50%);color:var(--color-text);">4w</span>
          <span>9w worst</span>
        </div>
      </div>

      <button class="btn btn-primary btn-block">Finalize item</button>

      <div class="field">
        <label>Notes (captured during discussion, Markdown supported)</label>
        <textarea class="input" rows="6"></textarea>
      </div>
    </main>
  </div>
</div>


</body>
</html>
