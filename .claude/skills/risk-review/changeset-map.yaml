# The changeset map in the Review guide: where each changed file of a branch is drawn.
# Everything specific to this repository lives here, not in the map code, so the map can
# be used elsewhere with another file. Read by scripts/reviewMap.ts.

# Files under this folder are placed in a layer; everything else goes to a strip.
sourceRoot: src

# The layers in drawing order, top to bottom. The first folder below sourceRoot names the
# layer, the folder below that the slice.
#   group: ui        drawn together inside one "UI" frame
#   side: true       drawn as a column at the right edge, spanning every row (at most one)
#   wholeSlice: true the whole layer is one slice
# A file below sourceRoot whose folder is in no layer is drawn in an "Unplaced" row.
layers:
  - name: app
    wholeSlice: true
  - name: pages
    group: ui
  - name: widgets
    group: ui
  - name: features
    group: ui
  - name: entities
    group: ui
  - name: shared
    group: ui
  - name: application
  - name: domain
  - name: adapters
    side: true

# The side strips for files outside sourceRoot, drawn in this order below the layers. A file
# goes to the first strip with a matching path, so Docs comes before the tooling strip:
# AGENTS.md and the agent and skill prompts under .claude/ read as docs. A file no strip
# matches goes to an "Other" strip. `<folder>/**` also covers dot files below the folder.
strips:
  - name: Specs
    paths: ['specs/**', 'e2e/**']
  - name: Docs
    paths:
      - 'docs/**'
      - 'design_handoffs/**'
      - 'design_handoff_estimate_app/**'
      - '**/*.md'
      # `**` never enters a dot folder, so the prompts under .claude/ are named here.
      - '.claude/**/*.md'
  - name: Agent, CI and tooling
    paths:
      - '.claude/**'
      - '.github/**'
      - '.githooks/**'
      - 'scripts/**'
      - '*.json'
      - '*.yaml'
      - '*.ts'
      - '*.cjs'
      - '*.mjs'
      - '.*'

# Files left off the map and only counted: tests and their helpers, styles, type
# declarations.
offMap:
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/testHelpers.ts'
  - '**/testFixtures.ts'
  - '**/*.css'
  - '**/*.d.ts'
  - 'src/setupTests.ts'
